  - id: DEV-COORD-001
    title: Automate structured development handoff between AI participants
    status: complete
    owner_role: coordinator_implementation
    depends_on: [GOV-001]
    allowed_paths:
      - .uni-dev/tasks.yaml
      - docs/decisions/ADR-0009-development-coordination-layer.md
      - docs/DEVELOPMENT_COORDINATOR.md
      - uni/devcoord
      - scripts/uni_dev_coordinator.py
      - tests/devcoord
      - .gitignore
    acceptance:
      - development coordination is isolated from product capabilities and personal memory
      - tasks handoffs artifacts provider results and events use bounded typed records
      - artifact paths cannot escape the workspace and include size plus SHA-256
      - free API providers and configured browser providers share one provider interface
      - paid APIs are never selected unless explicitly enabled
      - browser automation uses a dedicated profile and never bypasses authentication CAPTCHA or limits
      - external responses remain untrusted proposals and never mutate source code automatically
      - tasks terminate after their explicit provider sequence
      - CLI can create inspect and run a development task
      - tests and architecture audit pass
