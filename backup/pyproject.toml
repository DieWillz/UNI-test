[project]
name = "uni"
version = "0.1.0"
description = "UNI - Universal AI Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "pyyaml>=6.0",
    "openai>=1.30",
    "playwright>=1.40",
    "pyautogui>=0.9",
    "comtypes>=1.2",
    "faster-whisper>=1.0",
    "piper-tts>=1.2",
    "pillow>=10.0",
    "rich>=13.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]