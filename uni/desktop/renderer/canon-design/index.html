<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src http://127.0.0.1:8787; img-src 'self' data:; media-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'">
<title>UNI Desktop Companion</title>
<!-- V-02 FIX: importmap резолвит bare-импорты 'three' / '@pixiv/three-vrm' внутри
     зависимостей (GLTFLoader, three-vrm), т.к. Electron renderer не имеет bundler'а. -->
<script type="importmap">
{
  "imports": {
    "three": "../node_modules/three/build/three.module.js",
    "three/": "../node_modules/three/",
    "@pixiv/three-vrm": "../node_modules/@pixiv/three-vrm/lib/three-vrm.module.min.js"
  }
}
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="root">
  <div id="toolbar">
    <button class="rbtn" id="btnSettings" title="Настройки">⚙</button>
    <button class="rbtn" id="btnVision" title="Зрение">👁</button>
    <button class="rbtn" id="btnAuto" title="Уровень автономии">🎚</button>
    <button class="rbtn danger" id="btnStop" title="СТОП">🛑</button>
    <button class="rbtn" id="btnHide" title="Скрыть">▽</button>
  </div>

  <div id="chatPanel">
    <div id="messages"></div>
    <div id="composer">
      <textarea id="input" placeholder="Напиши Юни… (Enter — отправить)"></textarea>
      <button id="sendBtn">➤</button>
    </div>
  </div>

  <div id="avatar">
    <img id="avatarImg" src="../assets/avatar_idle.svg" alt="Юни" />
    <canvas id="vrmCanvas" class="hidden"></canvas>
    <div id="bubble" class="hidden"></div>
  </div>

  <div id="obsIndicator" class="hidden">👁 наблюдает</div>

  <div id="selfTest" class="hidden">
    <h3>Самотест Юни</h3>
    <div id="selfTestBody">Нажми «Запустить самотест».</div>
    <button id="btnRunSelfTest">▶ Запустить самотест</button>
  </div>

  <div id="settings" class="hidden">
    <h3>Настройки</h3>
    <label>Роль: <select id="roleSel"></select></label>
    <label>Голос (TTS): <select id="voiceSel"></select></label>
    <label>Уровень автономии:
      <select id="autoSel"><option value="off">off</option><option value="observe">observe</option><option value="suggest">suggest</option><option value="act">act</option></select>
    </label>
    <label><input type="checkbox" id="obsChk" /> Разрешить наблюдение экрана</label>
    <label><input type="checkbox" id="autostartChk" /> Автозапуск</label>
    <label>Прозрачность: <input type="range" id="opacity" min="0.3" max="1" step="0.05" value="1"></label>
    <label>Интерфейс (v4 / classic):
      <select id="variantSel">
        <option value="classic">classic (дефолт)</option>
        <option value="v4">v4 (новый)</option>
      </select>
    </label>
    <div class="row">
      <button id="btnMouseDemo" title="Демо мыши Юни">🖱 Демо мыши</button>
      <button id="btnSelfTest" title="Самотест Юни">🩺 Самотест</button>
    </div>
    <button id="saveSettings">Сохранить</button>
  </div>
</div>
<script src="avatar.js" type="module"></script>
<script src="app.js"></script>
</body>
</html>
