      - one-shot look captures one frame analyzes it and releases the device
      - long watch is bounded and can be stopped by voice command
      - long watch announces completion and reminds every configured interval
      - camera frames and public observations are logged as session artifacts
      - camera tools are not exposed to free-form LLM tool calling
      - tests architecture audit and a consented live frame check pass

  - id: AUDIO-MESSAGE-001
    title: Export UNI speech as WAV or MP3 message files
    status: approved
    owner_role: coordinator_implementation
    depends_on: [VOICE-SILERO-001, REALTIME-ROLE-001]
