<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Удалённое управление Юни</title><style>body{font:16px system-ui;background:#111827;color:#f9fafb;max-width:520px;margin:0 auto;padding:28px}.card{background:#1f2937;padding:24px;border-radius:18px}input{width:100%;margin:25px 0;accent-color:#ec4899}button{font-size:18px;padding:14px 22px;border:0;border-radius:12px}.stop{background:#dc2626;color:white;width:100%}.value{text-align:center;font-size:42px}.status{color:#9ca3af;text-align:center;margin:12px}</style></head><body><div class="card"><h2>Управление устройством Юни</h2><div class="status" id="status">Подключение…</div><div class="value"><span id="value">0</span>%</div><input id="range" type="range" min="0" max="40" value="0"><button class="stop" id="stop">СТОП</button></div><script>
const token=new URLSearchParams(location.hash.slice(1)).get('token')||'';let seq=0,alive=true;const range=document.getElementById('range'),value=document.getElementById('value'),status=document.getElementById('status');
async function send(path,data={}){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({...data,sequence:++seq})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('HTTP '+r.status));if(d.max_intensity!=null)range.max=d.max_intensity;status.textContent='Соединение активно';return d}
let timer=null;range.oninput=()=>{value.textContent=range.value;clearTimeout(timer);timer=setTimeout(()=>send('/api/xtoys/remote/control',{value:Number(range.value)}).catch(e=>status.textContent=e.message),60)};
document.getElementById('stop').onclick=()=>{range.value=0;value.textContent='0';send('/api/xtoys/remote/control',{value:0}).catch(e=>status.textContent=e.message)};
setInterval(()=>send('/api/xtoys/remote/heartbeat').catch(e=>status.textContent=e.message),1000);window.addEventListener('pagehide',()=>navigator.sendBeacon('/api/xtoys/remote/control',JSON.stringify({token,value:0,sequence:++seq})));
send('/api/xtoys/remote/heartbeat').catch(e=>status.textContent=e.message);
</script></body></html>
