<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNI · Admin Console</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-logo">U</div>
      <div>
        <div class="brand-name">UNI</div>
        <div class="brand-sub">Admin Console · v2.0</div>
      </div>
    </div>

    <div class="nav-section-label">Система</div>
    <button class="nav-item active" data-view="overview"><span class="nav-icon">📊</span><span>Обзор</span></button>
    <button class="nav-item" data-view="agents"><span class="nav-icon">👥</span><span>Агенты</span></button>
    <button class="nav-item" data-view="logs"><span class="nav-icon">📜</span><span>Логи</span></button>
    <button class="nav-item" data-view="journal"><span class="nav-icon">📓</span><span>Журнал</span></button>

    <div class="nav-section-label">Управление</div>
    <button class="nav-item" data-view="chat"><span class="nav-icon">💬</span><span>Чат с Юни</span><span class="nav-badge new">NEW</span></button>
    <button class="nav-item" data-view="computer"><span class="nav-icon">🖥</span><span>Компьютер</span></button>
    <button class="nav-item" data-view="vision"><span class="nav-icon">👁</span><span>Мышь + Зрение</span></button>
    <button class="nav-item" data-view="autonomous"><span class="nav-icon">⚡</span><span>Автономность</span></button>
    <button class="nav-item" data-view="xtoys"><span class="nav-icon">🔌</span><span>XToys</span><span class="nav-badge warn">L4</span></button>

    <div class="nav-section-label">Разработка</div>
    <button class="nav-item" data-view="tasks"><span class="nav-icon">📋</span><span>Задачи</span></button>
    <button class="nav-item" data-view="reports"><span class="nav-icon">📄</span><span>Отчёты</span></button>
    <button class="nav-item" data-view="tools"><span class="nav-icon">🛠</span><span>Инструменты</span></button>

    <div class="nav-section-label">Конфиг</div>
    <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span><span>Настройки</span></button>
  </aside>

  <!-- MAIN -->
  <main id="main">

    <!-- TOPBAR -->
    <div id="topbar" class="glass">
      <span class="status-pill"><span class="dot" id="dotLlama"></span><span id="lblLlama">LLM :1235</span></span>
      <span class="status-pill"><span class="dot" id="dotWebui"></span>WebUI :8787</span>
      <span class="status-pill"><span class="dot" id="dotDesktop"></span><span id="lblDesktop">Desktop</span></span>
      <span class="status-pill"><span class="dot" id="dotLms"></span><span id="lblLms">LM :1234</span></span>
      <div class="spacer"></div>
      <span class="status-pill" id="connPill"><span class="dot" id="dotConn"></span><span id="lblConn">проверка…</span></span>
      <button class="btn btn-sm" id="compactBtn" title="Компактный режим">📐</button>
      <button class="btn btn-sm" id="themeBtn" title="Сменить тему">🌙</button>
      <button class="btn btn-sm danger" id="stopBtn" title="Экстренный СТОП">■ STOP</button>
    </div>

    <!-- Views content omitted for brevity - original file preserved in backup -->
    <!-- See original at: c:\LLM\UNI\uni\webui\backup_before_rebuild\ -->

  </main>
</div>

<div class="toast" id="toast"></div>
<script src="app.js"></script>

</body>
</html>
