    acceptance:
      - tts provider is selectable in config
      - Silero Russian v5 uses an explicit speaker and native sample rate
      - Piper remains available as an offline fallback
      - a synthesis failure never crashes the interactive loop
      - unit tests cover both synthesis adapters

  - id: VISION-UI-001
    title: Add a reusable vision-guided Windows UI operator
    status: approved
    owner_role: coordinator_implementation
    depends_on: [VISION-GRADIO-001, REALTIME-ROLE-001]
    allowed_paths:
      - uni/capabilities/computer.py
      - uni/capabilities/vision.py
      - uni/config.py
      - uni/event_loop.py
      - uni/tools/definitions.py
      - uni/tools/executors.py
      - uni/visual_ui_operator.py
      - uni/skills/operate-windows-visually
      - tests/fasttrack/test_commands.py
      - tests/fasttrack/test_visual_ui_operator.py
      - config.yaml
    acceptance:
      - desktop screenshots are analyzed independently of the browser capability
      - the operator locates a described element then clicks only its returned center point
      - every click is followed by a fresh screenshot before the next decision
      - Unicode text entry works through clipboard paste rather than ASCII-only typewrite
      - representational messages are drafted but not sent until a separate confirmation
      - workflow steps are bounded and logged
      - the reusable Markdown skill passes validation
      - tests and architecture audit pass

  - id: COUNCIL-001
    title: Specify independent AI council and bounded autonomy policy
    status: needs_independent_review
    owner_role: coordinator_architect
    depends_on: [GOV-001]
    allowed_paths:
      - docs/decisions/ADR-0008-ai-council-and-bounded-autonomy.md
      - docs/specs/ai-council.md
    acceptance:
      - adviser calls are independent bounded and failure tolerant
      - consensus is separated from evidence verification
      - browser adviser output is treated as untrusted data
      - safe autonomous actions and confirmation-required actions are explicit
      - idle learning is preemptible isolated bounded and knowledge is quarantined
      - experiment action time and progress bounds terminate
      - DeepSeek adversarial review and Qwen feasibility review are complete

  - id: COUNCIL-002
    title: Implement report-only AI council for interactive mode
    status: blocked_by_council_001
    owner_role: python_implementation
    depends_on: [COUNCIL-001]
    allowed_paths:
      - uni/council
      - uni/config.py
      - uni/event_loop.py
      - uni/session_log.py
      - config.yaml
      - tests/council
    acceptance:
      - two to five providers can be queried concurrently
      - provider sessions timeouts and response sizes are bounded
      - one critic and one synthesizer produce a validated report
      - important claims retain verified or unverified status
      - no adviser output can invoke a UNI tool
      - full report is logged and a short summary is spoken

  - id: IDLE-LEARN-001
    title: Add preemptible idle council learning with quarantined knowledge
    status: blocked_by_council_002
    owner_role: python_implementation
    depends_on: [COUNCIL-002]
    allowed_paths:
      - uni/council
      - uni/config.py
      - uni/event_loop.py
      - uni/working_memory.py
      - config.yaml
      - tests/council
    acceptance:
      - idle mode starts only after configured inactivity and cooldown
      - any user activity cancels current idle work promptly
      - provider and browser budgets terminate every session
      - a separate browser profile never disrupts the user desktop
      - learned notes retain sources confidence expiry and contradictions
      - unverified notes cannot become instructions or runtime policy

  - id: AUTONOMY-001
    title: Execute bounded safe experiments from accepted council reports
    status: blocked_by_planner_and_council
    owner_role: lead_integration
    depends_on: [COUNCIL-002, PLAN-001, ROUTER-001]
    allowed_paths:
      - pending after accepted Planner integration task
    acceptance:
      - only autonomous-safe steps enter the execution queue
      - confirmation-required steps pause immediately before action
      - action time monetary and no-progress budgets terminate
      - every action result and public decision rationale is logged
      - denied income schemes and prompt injection cannot create actions

  - id: CAMERA-001
    title: Add announced webcam look and long-watch modes
    status: approved
    owner_role: coordinator_implementation
    depends_on: [REALTIME-ROLE-001, VISION-GRADIO-001]
    allowed_paths:
