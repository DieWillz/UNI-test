      - MP3 export uses local ffmpeg and reports a clear error when unavailable
      - empty text and paths outside the session artifact directory are rejected by orchestration
      - generated files are logged but not sent automatically
      - every Telegram upload or send still requires a separate confirmation
      - tests and architecture audit pass

  - id: VK-CHAT-001
    title: Prepare transparent UNI drafts in an existing VK chat
    status: approved
    owner_role: coordinator_implementation
    depends_on: [VISION-UI-001, AUDIO-MESSAGE-001]
    allowed_paths:
      - uni/capabilities/computer.py
      - uni/event_loop.py
      - uni/tools/executors.py
      - uni/visual_ui_operator.py
      - tests/fasttrack/test_commands.py
      - tests/fasttrack/test_visual_ui_operator.py
    acceptance:
