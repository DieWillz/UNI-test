      - workflow is bounded reobserves after UI changes and stops on ambiguity

  - id: TELEGRAM-UNI-001
    title: Bind UNI messaging to its dedicated portable Telegram account
    status: approved
    owner_role: coordinator_implementation
    depends_on: [VISION-UI-001]
    allowed_paths:
      - .uni-dev/tasks.yaml
      - uni/agent.py
      - uni/capabilities/computer.py
