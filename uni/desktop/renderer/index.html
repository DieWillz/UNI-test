<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src http://127.0.0.1:8787; img-src 'self' data:; media-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'">
  <title>Юни</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Оверлей прозрачный frameless: только виджет Юни, без демо-обёртки -->
  <section id="uniWidget" class="uni-widget mode-quick" aria-label="Окно Юни">
    <div id="avatar" class="avatar avatar--working" aria-label="Юни работает">
      <img id="avatarImg" class="avatar-img" src="../assets/uni-small-work.png" alt="Юни">
    </div>

    <header class="widget-header">
      <div class="brand" aria-label="Юни"><img class="brand-logo" src="../assets/logo-U-transparent.png" alt="Юни"><b>Юни</b></div>
      <button id="statusButton" class="live-status" aria-haspopup="true" aria-expanded="false"><i></i><span id="headerStatus">Выполняю</span></button>
      <nav class="header-actions" aria-label="Быстрые действия">
        <!-- 🤖 C-02 (2026-08-13): порядок микрофон → глаз → STOP(нейтр.) → остальные → ⚙ → − -->
        <button id="micButton" class="icon-button" title="Голосовой ввод" aria-label="Голосовой ввод"><img src="../assets/icons/mic-svgrepo-com.svg" alt=""></button>
        <button id="visionButton" class="icon-button vision-icon active" title="Наблюдение экрана" aria-label="Наблюдение экрана"><img src="../assets/icons/eye-2-svgrepo-com.svg" alt=""></button>
        <!-- 🤖 Hermes (2026-08-14): кнопка режима мыши Юни (аддитивно к 👁).
             Отдельный id uniMouseButton, чтобы не конфликтовать с существующей
             mouseModeButton (toggleMouseOnly / goal mouse_only). -->
        <button id="cameraButton" class="icon-button camera-icon" title="Камера выключена" aria-label="Камера" aria-pressed="false"><img src="../assets/icons/computer-camera-off-svgrepo-com.svg" alt=""></button>
        <button id="mouseModeButton" class="icon-button mouse-icon" title="Физический режим мыши" aria-label="Физический режим мыши" aria-pressed="false"><img src="../assets/icons/mouse-svgrepo-com.svg" alt=""></button>
        <button id="overlayButton" class="icon-button overlay-icon" title="Прозрачный режим" aria-label="Прозрачный режим"><img src="../assets/icons/ghost-svgrepo-com.svg" alt=""></button>
        <button id="settingsButton" class="icon-button settings-icon" title="Настройки" aria-label="Настройки"><img src="../assets/icons/settings-3-svgrepo-com.svg" alt=""></button>
        <button id="minimizeButton" class="icon-button minimize-button" title="Развернуть окно" aria-label="Развернуть окно"><img src="../assets/icons/fullscreen-2-svgrepo-com.svg" alt=""></button>
      </nav>
    </header>

    <div id="statusPopover" class="popover hidden"></div>
    <div id="settingsPopover" class="popover settings-popover hidden">
      <div><b>Оформление</b><button id="themeButton">☾ Тёмная</button></div>
      <label>Прозрачность <input id="opacityInput" type="range" min="55" max="95" value="72"></label>
      <label><input id="motionInput" type="checkbox" checked> Анимации аватара</label>
      <label><input id="autoVoiceInput" type="checkbox"> Автоматически слушать голос</label>
      <div><b>Демо</b><button id="demoMouseButton" title="Прогон мыши Юни: 3 клика + фигура с лайм-кольцом">🖱 Демо мыши</button></div>
    </div>

    <div class="widget-content">
      <section id="quickMode" class="mode-panel quick-panel">
        <!-- Пустой чат: приветствие + чипы быстрых действий (ФИНАЛ §3) -->
        <div id="emptyChat" class="empty-chat">
          <div class="greeting" id="greetingText">Привет</div>
          <div class="sub">Чем займёмся?</div>
          <div class="chips">
            <button class="chip" data-q="Открой сайт">Открой сайт</button>
            <button class="chip" data-q="Напиши текст">Напиши текст</button>
            <button class="chip" data-q="Что на экране">Что на экране</button>
          </div>
        </div>
        <!-- Чат-тред: пузыри пользователя и Юни -->
        <div id="chatThread" class="chat-thread"></div>
        <!-- чат и карточка задачи рендерятся динамически из app.js -->
        <article class="task-card" id="quickTaskCard" style="display:none">
          <div class="card-title"><b id="quickTaskTitle">Задача</b><button class="collapse-button" data-collapse="quickSteps">⌃</button></div>
          <div id="quickSteps" class="steps"></div>
          <div class="progress-row"><div class="progress"><i id="quickProgress"></i></div><span id="quickStepsCount">0/0</span></div>
        </article>
        <!-- 🤖 Универсальные динамические карточки (ui_events) рендерятся сюда -->
        <div id="dynamicCards" class="dynamic-cards"></div>
        <div id="quickActionStrip" class="action-strip done" style="display:none"><i></i><span id="quickAction"></span></div>
        <article id="quickResult" class="result-card hidden"></article>
      </section>

      <section id="missionMode" class="mode-panel mission-panel hidden">
        <article class="mission-card">
          <div class="mission-title"><div><b id="missionTitle">Миссия</b><span id="missionSub">—</span></div><span id="missionPercent">—</span></div>
          <div class="mission-layout">
            <div class="steps mission-steps" id="missionSteps"></div>
            <div class="mission-now"><div id="missionActionStrip" class="action-strip"><i></i><span id="missionAction">—</span></div>
              <details open><summary>Последние действия</summary><div id="missionRecent"></div></details>
            </div>
          </div>
          <div class="progress-row mission-progress"><div class="progress"><i id="missionProgress"></i></div><span id="missionStage">—</span></div>
          <div class="money-row"><div><span>Подтверждено</span><b id="missionConfirmed">0 ₽</b></div><div><span>Ожидается</span><b id="missionExpected">—</b></div><div><span>Затраты</span><b id="missionCosts">0 ₽</b></div></div>
          <div class="approval"><span>Для запуска потребуется подтверждение</span><button id="notifyButton">Сообщить</button><small>Доход учитывается после подтверждения поступления</small></div>
        </article>
      </section>
    </div>

    <footer class="composer">
      <button id="attachButton" class="attach-button" aria-label="Прикрепить" title="Прикрепить файл"><img src="../assets/icons/attachment-2-svgrepo-com.svg" alt=""></button>
      <textarea id="messageInput" rows="1" placeholder="Напиши Юни…"></textarea>
      <button id="composerMic" class="composer-mic" aria-label="Голосовой ввод"><img src="../assets/icons/mic-svgrepo-com.svg" alt=""></button>
      <i id="connectionDot" class="connection-dot" title="Связь с сервером"></i>
      <button id="sendButton" class="send-button" aria-label="Отправить">➤</button>
    </footer>
  </section>

  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
