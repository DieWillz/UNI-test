<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="popup.css">
    <title>Blockify Ad Blocker</title>
     <!-- array js -->
    <script src="popup.js" async></script>
</head>
<body>
    <style id="noremove">
        body > *
        {
            display: none !important;
        }
    </style>
    <div id="header">
        <div class="m_l_30"><img src="frame/icon.svg"><div><div id="logo_t">Blockify</div><div id="version"></div></div></div>
        <div class="m_r_30" id="rhs">
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSeKqZXoknDYzCl5pjNcfR3MBGF3hl4EHrFxJjBrihuHjHHF0Q/viewform?usp=header" target="_blank"> <img src="idea.png"> </a>
        <a href="https://getblockify.com/welcome/?help=true" target="_blank"> <img src="help1.png" id="gm"> </a>
        <button id="promo_heart_btn" class="none" title="Support Blockify">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#00ffa1"/></svg>
        </button>
        <div id="menu_container" class="none">
            <button id="menu_btn" title="More options">
                <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="5" r="2" fill="#aaa"/><circle cx="12" cy="12" r="2" fill="#aaa"/><circle cx="12" cy="19" r="2" fill="#aaa"/></svg>
            </button>
            <div id="menu_dropdown" class="none">
                <a href="#" id="support_blockify_link" class="menu-item menu-link">
                    <span class="menu-label">Blockify Supporter Program</span>
                </a>
            </div>
        </div>
        </div>
    </div>
    <div id="mainE">
        <div id="mainT">Block ads on:</div>
        <div class="toggle-container">
            <div class="options six">All Websites</div>
            <input type="checkbox" id="all_sites" name="all_sites" class="toggle-input">
            <label for="all_sites" class="toggle-label">
                <span class="toggle-fill"></span>
                <span class="toggle-icon"></span>
            </label>
        </div>
        <div class="toggle-container" id="website_cont">
            <div class="options" id="website"></div>
            <input type="checkbox" id="specific_site" name="specific_site" class="toggle-input">
            <label for="specific_site" class="toggle-label">
                <span class="toggle-fill"></span>
                <span class="toggle-icon"></span>
            </label>
        </div>
        <div class="toggle-container" id="spotify_cont">
            <a class="options" href="https://open.spotify.com/" target="_blank">open.spotify.com</a>
            <input type="checkbox" id="spotify" name="spotify" class="toggle-input">
            <label for="spotify" class="toggle-label">
                <span class="toggle-fill"></span>
                <span class="toggle-icon"></span>
            </label>
        </div>
    </div>

    <div id="counter_p" class="none">
        Ads Blocked:  <span id="counter"></span>
    </div>
   
    <!--
    <script src="permission_check.js" async defer></script>
    -->
    <div id="blocked-count" class="none">Total Ads Blocked:  <span id="counter2"></span></div>

    <div id="temp"></div>
    <div id="temp2"></div>
</body>
</html>
