  - id: STT-INPUT-001
    title: Improve quiet-microphone speech recognition
    status: approved
    owner_role: coordinator_implementation
    depends_on: [REALTIME-ROLE-001]
    allowed_paths:
      - .uni-dev/tasks.yaml
