<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Удалённая комната Юни</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#032121;color:#eaf6d8;font:15px system-ui}body{padding:12px}.layout{max-width:1200px;margin:auto;display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);gap:12px}.card{background:#052626;border:1px solid rgba(196,229,52,.18);border-radius:14px;padding:14px}.media{aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#6d8f6a}video{width:100%;height:100%;object-fit:contain}.status{color:#9fbf85;margin:8px 0}.value{text-align:center;font-size:38px;color:#c4e534}input[type=range]{width:100%;margin:14px 0;accent-color:#c4e534}button{padding:10px 14px;border:1px solid rgba(196,229,52,.25);border-radius:8px;background:#073030;color:#eaf6d8;cursor:pointer}.stop{background:#b91c1c;border:0;width:100%;font-weight:700}.chat{height:250px;overflow:auto;background:#032121;border-radius:8px;padding:8px;margin:10px 0}.chat div{margin:4px 0}.row{display:flex;gap:6px}.row input{flex:1;min-width:0;padding:9px;border-radius:7px;border:1px solid rgba(196,229,52,.25);background:#073030;color:#fff}@media(max-width:760px){.layout{grid-template-columns:1fr}.chat{height:160px}}
</style></head><body><div class="layout"><div class="card"><h2>📹 Камера и звук Юни</h2><div class="media"><video id="video" autoplay playsinline controls></video><span id="waiting">Ожидание трансляции владельца…</span></div><div class="status" id="mediaStatus">подключение к комнате…</div><button onclick="video.play()">Включить звук / воспроизведение</button></div><div class="card"><h2>🎛 Управление</h2><div class="status" id="status">Подключение…</div><div class="value"><span id="value">0</span>%</div><input id="range" type="range" min="0" max="40" value="0"><button class="stop" id="stop">СТОП · 0%</button><h3>💬 Чат</h3><div class="chat" id="chat"></div><div class="row"><input id="message" maxlength="1000" placeholder="Сообщение владельцу"><button id="sendChat">Отправить</button></div></div></div>
<script>
const token=new URLSearchParams(location.hash.slice(1)).get('token')||'';let seq=0,after=0,pc=null,pendingIce=[];const range=document.getElementById('range'),value=document.getElementById('value'),status=document.getElementById('status'),mediaStatus=document.getElementById('mediaStatus');
async function send(path,data={}){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({...data,sequence:++seq})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('HTTP '+r.status));if(d.max_intensity!=null)range.max=d.max_intensity;status.textContent='Соединение активно';return d}
async function room(body){const r=await fetch('/api/xtoys/remote/room',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({role:'controller',...body})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}
async function ensurePeer(){if(pc)return pc;pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});pc.onicecandidate=e=>{if(e.candidate)room({action:'send',kind:'ice',payload:e.candidate.toJSON()}).catch(()=>{})};pc.ontrack=e=>{video.srcObject=e.streams[0];waiting.style.display='none';video.play().catch(()=>{});mediaStatus.textContent='видео и звук подключены'};pc.onconnectionstatechange=()=>mediaStatus.textContent='медиа: '+pc.connectionState;return pc}
function addChat(who,text){const row=document.createElement('div');row.textContent=who+': '+text;chat.appendChild(row);chat.scrollTop=chat.scrollHeight}
async function pollRoom(){try{const d=await room({action:'poll',after});for(const e of d.events||[]){after=Math.max(after,e.id);if(e.kind==='offer'){const p=await ensurePeer();await p.setRemoteDescription(e.payload);for(const c of pendingIce.splice(0))await p.addIceCandidate(c);const answer=await p.createAnswer();await p.setLocalDescription(answer);await room({action:'send',kind:'answer',payload:p.localDescription.toJSON()})}else if(e.kind==='ice'){const p=await ensurePeer();if(p.remoteDescription)await p.addIceCandidate(e.payload);else pendingIce.push(e.payload)}else if(e.kind==='chat')addChat('Владелец',String(e.payload||''));else if(e.kind==='hangup'){if(pc){pc.close();pc=null}video.srcObject=null;waiting.style.display='inline';mediaStatus.textContent='трансляция остановлена'}}}catch(e){mediaStatus.textContent=e.message}}
let timer=null;range.oninput=()=>{value.textContent=range.value;clearTimeout(timer);timer=setTimeout(()=>send('/api/xtoys/remote/control',{value:Number(range.value)}).catch(e=>status.textContent=e.message),60)};stop.onclick=()=>{range.value=0;value.textContent='0';send('/api/xtoys/remote/control',{value:0}).catch(e=>status.textContent=e.message)};
sendChat.onclick=async()=>{const text=message.value.trim();if(!text)return;try{await room({action:'send',kind:'chat',payload:text});addChat('Ты',text);message.value=''}catch(e){status.textContent=e.message}};message.onkeydown=e=>{if(e.key==='Enter')sendChat.click()};
setInterval(()=>send('/api/xtoys/remote/heartbeat').catch(e=>status.textContent=e.message),1000);setInterval(pollRoom,700);addEventListener('pagehide',()=>navigator.sendBeacon('/api/xtoys/remote/control',JSON.stringify({token,value:0,sequence:++seq})));send('/api/xtoys/remote/heartbeat').catch(e=>status.textContent=e.message);pollRoom();
</script></body></html>
