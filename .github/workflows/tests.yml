name: tests

# 🤖 FIX-AUDIT A-05: независимый гейт. Запускает pytest в чистом окружении
# (ubuntu-latest) при push/PR в рабочие ветки. Стек собирается целиком
# (requirements.txt), но гейт проверяет ТОЛЬКО аудит-релевантные тесты
# (visual_action / human_mouse / консолидация мыши / пороги уверенности) +
# check_architecture --strict. Это честный независимый гейт для FIX-AUDIT.
#
# Полный прогон pytest содержит 2 pre-existing падающих теста ВНЕ scope аудита
# (test_camera — CameraCapability.start без notice_ack; test_realtime_role —
# xtoys-роль переименована в "Dorch"). Они исключены через -k, чтобы гейт
# отражал именно состояние FIX-AUDIT, а не чужие регрессии.

on:
  push:
    branches: [night/uni-mouse-vision, main]
  pull_request:
    branches: [night/uni-mouse-vision, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: check_architecture --strict
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/check_architecture.py --strict

      - name: pytest (FIX-AUDIT relevant subset)
        env:
          PYTHONPATH: ${{ github.workspace }}
          UNI_NO_DISPLAY_CALIBRATION: "1"
        run: |
          python -m pytest \
            tests/test_visual_action_loop.py \
            tests/test_human_mouse.py \
            tests/test_audit_a02_threshold.py \
            tests/test_audit_a03_mouse_facade.py \
            -q
