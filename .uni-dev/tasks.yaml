version: 1
canonical_source: uni

tasks:
  - id: GOV-001
    title: Establish canonical project governance
    status: complete
    owner_role: coordinator
    allowed_paths:
      - AGENTS.md
      - ARCHITECTURE.md
      - BUILD_STATUS.md
      - ROADMAP.md
      - docs/decisions
      - .uni-dev
      - scripts/check_architecture.py
    acceptance:
      - canonical source is explicit
      - variants are reference-only
      - architecture audit runs

  - id: CORE-001
    title: Specify canonical runtime contracts
    status: complete
    owner_role: coordinator_architect
    depends_on: [GOV-001]
    allowed_paths:
      - docs/decisions/ADR-0004-runtime-contracts.md
    acceptance:
      - Action schema is unambiguous
      - ActionResult schema covers success failure timeout and verification
      - Observation schema is bounded
      - AgentContext ownership and mutation rules are explicit
      - Task dependency identifiers are specified

  - id: CORE-002
    title: Implement accepted runtime contracts
    status: approved
    owner_role: developer
    depends_on: [CORE-001]
    allowed_paths:
      - uni/contracts.py
      - tests/unit/test_contracts.py
    acceptance:
      - one canonical definition per contract
      - contract unit tests pass
      - architecture audit reports no contract duplication in canonical source

  - id: ROUTER-001
    title: Specify capability manifest and router behavior
    status: complete
    owner_role: coordinator_architect
    depends_on: [CORE-001]
    allowed_paths:
      - docs/decisions/ADR-0005-capability-router.md
    acceptance:
      - manifest schema is explicit
      - routing errors map to ActionResult
      - capability dependency boundaries are explicit

  - id: PLAN-001
    title: Repair planner IDs validation retry and recovery algorithm
    status: proposed_incomplete
    owner_role: algorithms
    depends_on: [CORE-001, ROUTER-001]
    allowed_paths:
      - docs/specs/planner-algorithm.md
    evidence:
      - docs/reviews/HERMES_OPENCODE_COMPARISON.md
      - docs/reviews/COORDINATOR_REVIEW_HERMES_OPENCODE.md
      - docs/decisions/ADR-0004-runtime-contracts.md
      - docs/decisions/ADR-0005-capability-router.md
    acceptance:
      - stable step IDs and dependency mapping are defined
      - unknown actions are rejected before execution
      - retry replan and ask-user transitions terminate
      - LLM calls are bounded

  - id: DS-001
    title: Create DeepSeek development skills
    status: changes_requested
    owner_role: algorithms
    depends_on: [GOV-001]
    allowed_paths:
      - .uni-dev/skills/deepseek
    acceptance:
      - five complete skills exist as files
      - every skill includes required inputs failure conditions and self-check
      - no runtime Python is changed

  - id: PLAN-VECTORS-001
    title: Produce complete planner recovery verification test vectors
    status: changes_requested
    owner_role: algorithms
    depends_on: [CORE-001, ROUTER-001]
    allowed_paths:
      - .uni-dev/test-vectors
    evidence:
      - docs/reviews/HERMES_OPENCODE_COMPARISON.md
      - docs/reviews/COORDINATOR_REVIEW_HERMES_OPENCODE.md
    acceptance:
      - planner YAML contains at least 25 executable cases
      - recovery YAML contains at least 20 executable cases
      - verification YAML contains at least 15 executable cases
      - adversarial plans contain no ellipses or placeholders

  - id: ROUTER-002
    title: Implement canonical capability manifest registry and router
    status: blocked
    owner_role: developer
    depends_on: [CORE-002, ROUTER-001]
    allowed_paths:
      - uni/capabilities/base.py
      - uni/capabilities/registry.py
      - uni/capabilities/router.py
      - tests/unit/test_capability_manifest.py
      - tests/unit/test_capability_router.py
      - scripts/check_architecture.py
    acceptance:
      - parameter models are the schema source of truth
      - registration is atomic and rejects all defined conflicts
      - router dispatches exactly once and never retries
      - capability-to-capability imports are rejected
      - all router tests pass

  - id: INTEGRATE-001
    title: Implement one canonical autonomous event loop
    status: blocked
    owner_role: lead_implementation
    depends_on: [CORE-002, ROUTER-001, PLAN-001]
    allowed_paths:
      - uni/agent.py
      - uni/event_loop.py
      - uni/planner.py
      - uni/tools
      - uni/capabilities/registry.py
      - tests/integration
    acceptance:
      - planner router and verifier use AgentContext
      - every action produces ActionResult
      - transient retry permanent replan and user escalation are tested
      - no archived package is imported

  - id: HERMES-001
    title: Make XToys fallback results truthful
    status: approved
    owner_role: local_runtime_auditor
    depends_on: [GOV-001]
    allowed_paths:
      - uni/capabilities/xtoys.py
      - tests/unit/test_xtoys_fallback.py
      - docs/reviews/HERMES_XTOYS_HOTFIX.md
    acceptance:
      - browser success returns success without invoking desktop fallback
      - browser failure invokes desktop fallback at most once
      - missing coordinates or a fallback exception returns failure
      - a fallback attempt is not described as verified XToys state
      - regression tests cover browser success browser failure and fallback exception
      - no public contract or capability dependency is added

  - id: HERMES-002
    title: Harden Vision structured element detection
    status: approved
    owner_role: local_runtime_auditor
    depends_on: [GOV-001]
    allowed_paths:
      - uni/capabilities/vision.py
      - tests/unit/test_vision_element_parsing.py
      - docs/reviews/HERMES_VISION_HOTFIX.md
    acceptance:
      - plain JSON fenced JSON leading prose and null are tested
      - malformed or schema-invalid output returns a failure result
      - only one JSON value is accepted and trailing non-whitespace is rejected
      - x y width height and confidence have explicit numeric bounds
      - resized-image coordinates are transformed to original-screen coordinates
      - parser exceptions are logged without a bare except
      - no public contract is changed

  - id: HERMES-003
    title: Verify Piper TTS runtime compatibility
    status: approved
    owner_role: local_runtime_auditor
    depends_on: [GOV-001]
    allowed_paths:
      - docs/reviews/HERMES_TTS_COMPATIBILITY.md
    acceptance:
      - installed piper-tts version and voice API are recorded
      - actual synthesize return shape and sample rate source are recorded
      - proposed adapter behavior covers the observed API without guessing
      - no runtime Python is changed

  - id: HERMES-OPENCODE-AUDIT-001
    title: Compare OpenCode implementation with canonical UNI
    status: complete
    owner_role: local_runtime_auditor
    depends_on: [GOV-001]
    allowed_paths:
      - docs/reviews/HERMES_OPENCODE_COMPARISON.md
    acceptance:
      - all twelve requested findings include evidence and disposition
      - no OpenCode runtime file is copied or edited
      - coordinator corrections are recorded separately

  - id: FASTTRACK-MVP-001
    title: Deliver same-day interactive voice browser XToys MVP
    status: complete
    owner_role: coordinator_implementation
    depends_on: [GOV-001]
    allowed_paths:
      - docs/decisions/ADR-0007-fasttrack-interactive-mvp.md
      - uni/__main__.py
      - uni/agent.py
      - uni/brain.py
      - uni/browser_session.py
      - uni/capabilities/browser.py
      - uni/capabilities/speech.py
      - uni/capabilities/vision.py
      - uni/capabilities/xtoys.py
      - uni/config.py
      - uni/__main__.py
      - uni/capabilities/speech.py
      - uni/event_loop.py
      - uni/tools/definitions.py
      - uni/tools/executors.py
      - config.yaml
      - requirements.txt
      - tests/fasttrack
      - scripts/run_uni.ps1
    acceptance:
      - continuous microphone command loop starts under Python 3.12
      - Piper speech uses the voice native sample rate
      - browser uses one persistent visible Chrome context
      - browser navigation web search and XToys tab selection are deterministic
      - XToys never reports verified state after an unverified fallback
      - Vision accepts the active browser screenshot and handles fenced JSON
      - LM Studio unavailability produces an actionable message without killing deterministic commands
      - smoke tests avoid live XToys mutations

  - id: OPENCODE-FASTTRACK-001
    title: Harden XToys DOM adapter against the live authenticated page
    status: approved
    owner_role: lead_implementation
    depends_on: [FASTTRACK-MVP-001]
    allowed_paths:
      - uni/capabilities/xtoys.py
      - tests/fasttrack/test_xtoys_dom.py
      - docs/reviews/OPENCODE_XTOYS_DOM.md
    acceptance:
      - selectors are derived from inspected live DOM evidence
      - tests use saved minimal HTML fixtures or mocks and never drive a physical device
      - intensity respects configured maximum
      - operations never claim verified physical state without observation
      - no planner router contract or other capability is changed

  - id: HERMES-FASTTRACK-VERIFY-001
    title: Verify fast-track voice and browser runtime locally
    status: approved
    owner_role: local_runtime_auditor
    depends_on: [FASTTRACK-MVP-001]
    allowed_paths:
      - docs/reviews/HERMES_FASTTRACK_SMOKE.md
    acceptance:
      - microphone and output device identities are recorded
      - one Russian listen transcription and one Piper playback are confirmed
      - XToys tab open and web search are confirmed without device mutation
      - text LLM and optional Vision endpoint results are recorded separately
      - no runtime Python is changed

  - id: KILO-FASTTRACK-001
    title: Add preflight diagnostics and operator runbook
    status: approved
    owner_role: tooling_engineer
    depends_on: [FASTTRACK-MVP-001]
    allowed_paths:
      - scripts/preflight_uni.py
      - scripts/run_uni.ps1
      - docs/FASTTRACK_RUNBOOK.md
    acceptance:
      - Python 3.12 dependencies audio devices Piper model Playwright and LM Studio are checked
      - checks are read-only and do not open or mutate XToys
      - failures include an exact corrective command or config path
      - launcher can run voice mode text mode and one-shot command mode

  - id: VISION-GRADIO-001
    title: Connect active-tab Vision to local Gradio Moondream API
    status: complete
    owner_role: coordinator_implementation
    depends_on: [FASTTRACK-MVP-001]
    allowed_paths:
      - uni/capabilities/vision.py
      - uni/config.py
      - config.yaml
      - requirements.txt
      - tests/fasttrack/test_vision_gradio.py
    acceptance:
      - provider is selectable between gradio and openai
      - Gradio client is lazy and does not block startup
      - screenshot is uploaded through a temporary PNG removed after the request
      - answer_question falls back to answer_question_1 only for endpoint failure
      - Gradio calls run outside the asyncio event loop
      - live local endpoint returns a textual screenshot answer

  - id: REALTIME-ROLE-001
    title: Add non-blocking voice interaction and an editable XToys mistress role
    status: complete
    owner_role: coordinator_implementation
    depends_on: [FASTTRACK-MVP-001]
    allowed_paths:
      - uni/agent.py
      - uni/event_loop.py
      - uni/config.py
      - uni/roles/loader.py
      - uni/roles/xtoys_mistress.md
      - config.yaml
      - tests/fasttrack/test_commands.py
      - tests/fasttrack/test_realtime_role.py
    acceptance:
      - interactive voice mode continues accepting utterances while browser vision or LLM work is running
      - microphone recording and TTS playback never overlap
      - STT and TTS models can be warmed before the first utterance
      - each utterance has a bounded background task and shutdown cancels unfinished work
      - role markdown is loaded relative to the canonical package rather than the process CWD
      - the selected role is included in the LLM system prompt
      - stop and red are deterministic XToys emergency-zero commands
      - physical motion is never started merely by loading the role

  - id: LOGGED-EXPLORE-001
    title: Add image search and bounded logged browser exploration
    status: complete
    owner_role: coordinator_implementation
    depends_on: [REALTIME-ROLE-001, VISION-GRADIO-001]
    allowed_paths:
      - uni/agent.py
      - uni/browser_session.py
      - uni/capabilities/browser.py
      - uni/config.py
      - uni/event_loop.py
      - uni/session_log.py
      - uni/tools/definitions.py
      - uni/tools/executors.py
      - config.yaml
      - tests/fasttrack/test_commands.py
      - tests/fasttrack/test_session_log.py
      - tests/fasttrack/test_exploration.py
    acceptance:
      - image search opens a deterministic image-results page
      - exploration is read-only and bounded by configured steps
      - every exploration step saves a browser screenshot under the session log directory
      - user dialogue spoken narration actions results and public thought summaries are timestamped in a text log
      - passwords tokens and API keys are redacted before writing
      - hidden model chain of thought is neither requested nor persisted
      - tests and architecture audit pass

  - id: MIXED-INPUT-001
    title: Accept keyboard and microphone input in one interactive session
    status: approved
    owner_role: coordinator_implementation
    depends_on: [STT-INPUT-001, RUNTIME-UX-001]
    allowed_paths:
      - .uni-dev/tasks.yaml
      - uni/__main__.py
      - uni/config.py
      - uni/event_loop.py
      - config.yaml
      - tests/fasttrack/test_mixed_input.py
    acceptance:
      - mixed mode accepts console lines and recognized speech through one queue
      - keyboard input remains available while microphone listening is active
      - UNI keeps speaking responses in mixed mode
      - text-only and voice-only modes remain available
      - shutdown does not wait for a blocked console reader
      - targeted tests and architecture audit pass

  - id: VOICE-SILERO-001
    title: Add a selectable natural Russian Silero voice with Piper fallback
    status: complete
    owner_role: coordinator_implementation
    depends_on: [REALTIME-ROLE-001]
    allowed_paths:
      - uni/agent.py
      - uni/capabilities/speech.py
      - uni/config.py
      - uni/event_loop.py
