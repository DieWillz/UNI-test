brain:
  base_url: "http://localhost:1234/v1"
  model: "qwen2.5-7b-instruct"
  temperature: 0.3
  max_tokens: 2000

capabilities:
  browser:
    headless: false
    viewport:
      width: 1280
      height: 720
    timeout: 30000
  computer:
    use_uia: true
    failsafe: true
  speech:
    stt_model: "base"
    tts_voice: "ru_RU-irina-medium"
    sample_rate: 16000
  vision:
    enabled: true
    model: "llava"

agent:
  default_role: "assistant"
  cycle_interval: 3.0
  max_retries: 3
  verification_enabled: true

memory:
  path: "memory/working.json"
  max_context_tokens: 4000